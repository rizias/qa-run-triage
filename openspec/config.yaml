schema: spec-driven

context: |
  Language: russian
  All artifacts must be written in russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: TypeScript, ESM, Node 22+. Тесты — vitest. Полная проверка одной командой:
  npm run check (сборка, типы, линтер, поиск мёртвого кода, тесты).

  Комментариев в коде нет — ни однострочных, ни блочных, ни JSDoc. Это проверяется
  git-хуком перед коммитом. Непонятный код переписывается, а не комментируется.

  В репозитории не бывает реальных данных стенда и компании: токенов, адресов и доменов
  стендов, учётных записей, телефонов, адресов почты, номеров задач, чужих путей.

  Размеры называются числом, а не словами «как раньше» или «такой же».
